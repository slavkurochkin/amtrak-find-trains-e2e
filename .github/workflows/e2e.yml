name: E2E - Find trains

# Runs only when started by hand (Actions tab → "E2E - Find trains" → Run workflow).
# The tests drive the live amtrak.com, whose terms restrict automated access,
# so the suite never runs on a schedule or on every push: traffic stays minimal.
on:
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Chrome only (full suite), or all browsers (adds Firefox, WebKit and mobile Chrome with the key tests)'
        type: choice
        options: [chrome, all]
        default: chrome
      grep:
        description: 'Only run tests matching this pattern (e.g. @smoke, @negative, @STN-08)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Official Playwright image: browsers and OS deps preinstalled, and the same
    # rendering as `npm run test:visual:update:linux` (visual baselines).
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: 'true'
      TEST_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint, format and type-check
        run: npm run lint && npm run format:check && npm run typecheck

      - name: Spec coverage (every test maps to a requirement in specs/)
        run: npm run spec:coverage

      - name: Run tests
        run: >-
          npx playwright test
          ${{ inputs.browsers == 'all' && '--workers=2' || '--project=chromium-desktop' }}
          ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}

      # Everything below runs even when tests fail. The AI failure summary
      # (reports/failures.md) is also shown on the run's summary page.

      - name: Upload HTML report, JUnit and AI failure summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_attempt }}
          path: reports/
          retention-days: 14

      - name: Upload traces, screenshots and videos of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14
