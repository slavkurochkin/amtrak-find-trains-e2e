name: E2E - Find trains

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run catches changes on amtrak.com itself (the app under test is not ours).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (e.g. @smoke, @negative)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # for the failure comment on PRs

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      TEST_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Spec coverage (every test maps to a requirement in specs/)
        run: npm run spec:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}

      # Everything below runs even when tests fail.

      - name: Upload HTML report, JUnit and AI failure summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_attempt }}
          path: reports/
          retention-days: 14

      - name: Upload traces, screenshots and videos of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

      - name: Comment AI failure summary on the PR
        if: ${{ failure() && github.event_name == 'pull_request' && hashFiles('reports/failures.md') != '' }}
        # PRs from forks get a read-only token; don't fail the job over the comment.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-failure-summary -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = fs.readFileSync('reports/failures.md', 'utf8');
            if (summary.length > 60000) summary = summary.slice(0, 60000) + '\n\n… truncated, see the `reports` artifact.';
            const body = `${marker}\n${summary}\n\n---\n[Workflow run](${runUrl}) · artifacts: \`reports-*\` (HTML report, failures.md), \`test-results-*\` (traces: \`npx playwright show-trace <trace.zip>\`)`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
