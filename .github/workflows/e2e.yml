name: E2E - Find trains

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly run catches changes on amtrak.com itself (the app under test is not ours).
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      grep:
        description: 'Only run tests matching this pattern (e.g. @smoke, @negative)'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # for the failure comment on PRs

jobs:
  e2e:
    name: Playwright (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Official Playwright image: browsers and OS deps preinstalled, and the same
    # rendering as `npm run test:visual:update:linux` (visual baselines).
    # Keep the tag in sync with @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    env:
      CI: 'true'
      TEST_TZ: America/New_York
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Lint, format and type-check
        run: npm run lint && npm run format:check && npm run typecheck

      - name: Spec coverage (every test maps to a requirement in specs/)
        run: npm run spec:coverage

      # PRs / pushes: full suite on desktop Chromium (the gate).
      - name: Run tests
        if: ${{ github.event_name != 'schedule' }}
        run: npx playwright test --project=chromium-desktop ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}

      # Nightly: everything, including Firefox, WebKit and mobile (@smoke subset).
      - name: Run tests (all browsers)
        if: ${{ github.event_name == 'schedule' }}
        run: npx playwright test --workers=2

      # Everything below runs even when tests fail.

      - name: Upload HTML report, JUnit and AI failure summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_attempt }}
          path: reports/
          retention-days: 14

      - name: Upload traces, screenshots and videos of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_attempt }}
          path: test-results/
          retention-days: 14

      - name: Comment AI failure summary on the PR
        if: ${{ failure() && github.event_name == 'pull_request' && hashFiles('reports/failures.md') != '' }}
        # PRs from forks get a read-only token; don't fail the job over the comment.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- e2e-failure-summary -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let summary = fs.readFileSync('reports/failures.md', 'utf8');
            if (summary.length > 60000) summary = summary.slice(0, 60000) + '\n\n… truncated, see the `reports` artifact.';
            const body = `${marker}\n${summary}\n\n---\n[Workflow run](${runUrl}) · artifacts: \`reports-*\` (HTML report, failures.md), \`test-results-*\` (traces: \`npx playwright show-trace <trace.zip>\`)`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
